spring.application.name=orders-realtime

# -------------------------------------------------------
#  Default profile = 'embedded' (zero-setup, no install needed)
#  Switch to 'docker' to use docker-compose.yml instead:
#    mvn spring-boot:run -Dspring-boot.run.profiles=docker
# -------------------------------------------------------
spring.profiles.active=embedded

# --- PostgreSQL connection (used by 'docker' profile / external PG) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Run schema.sql on startup to create trigger ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Server ---
server.port=8080

# --- Logging ---
logging.level.com.realtime=INFO
